# Lichyflow self-hosted pipeline
# ENV: REPO_URL, REPO_DEFAULT_BRANCH, ISSUE_NUMBER
#
# Bash scripts live in ci/ — each step calls its script.
# You can test individual scripts: ISSUE_NUMBER=42 ARTIFACT_DIR=/tmp bash ci/fetch_issue.sh

pipeline:
  name: lichyflow-issue-fix
  start: setup_repo

  requirements:
    - command: git
      hint: Install git (apt install git / brew install git)
    - command: gh
      hint: Install GitHub CLI (apt install gh / brew install gh)
    - name: gh logged in
      check: gh auth status &>/dev/null
      hint: Login with gh auth login
    - command: go
      hint: Install Go (apt install golang / brew install go)
    - command: pi-stream
      hint: Install pi-stream (github.com/crazy-goat/pi-stream)

  exits:
    - name: ci_failed
      exit_code: 2
    - name: no_issues
      exit_code: 3
    - name: loop_exhausted
      exit_code: 4
    - name: build_failed
      exit_code: 5

  steps:
    - name: setup_repo
      type: bash
      command: bash "$PIPELINE_DIR/ci/setup_repo.sh"
      retry:
        max: 2
        backoff: exponential
        initial_delay: 5s
      timeout: 120

    - name: fetch_issue
      type: bash
      command: bash "$PIPELINE_DIR/ci/fetch_issue.sh"
      retry:
        max: 2
        backoff: exponential
        initial_delay: 3s
      timeout: 30

    - name: create_branch
      type: bash
      command: bash "$PIPELINE_DIR/ci/create_branch.sh"
      timeout: 30

    - name: llm_fix
      type: bash
      command: bash "$PIPELINE_DIR/ci/llm_fix.sh"
      retry:
        max: 1
        backoff: exponential
        initial_delay: 10s
      timeout: 600

    - name: run_tests
      type: bash
      command: bash "$PIPELINE_DIR/ci/run_tests.sh"
      timeout: 300

    - name: prepare_review
      type: bash
      command: bash "$PIPELINE_DIR/ci/prepare_review.sh"
      timeout: 10

    - name: code_review
      type: bash
      command: bash "$PIPELINE_DIR/ci/code_review.sh"
      retry:
        max: 1
        backoff: exponential
        initial_delay: 10s
      timeout: 300

    - name: check_review
      type: bash
      command: bash "$PIPELINE_DIR/ci/check_review.sh"
      timeout: 10

    - name: commit_push
      type: bash
      command: bash "$PIPELINE_DIR/ci/commit_push.sh"
      retry:
        max: 1
        backoff: fixed
        initial_delay: 10s
      timeout: 60

    - name: create_pr
      type: bash
      command: bash "$PIPELINE_DIR/ci/create_pr.sh"
      retry:
        max: 2
        backoff: exponential
        initial_delay: 10s
      timeout: 60

    - name: wait_ci
      type: bash
      command: bash "$PIPELINE_DIR/ci/wait_ci.sh"
      timeout: 600

    - name: merge_pr
      type: bash
      command: bash "$PIPELINE_DIR/ci/merge_pr.sh"
      timeout: 60

    - name: close_issue
      type: bash
      command: bash "$PIPELINE_DIR/ci/close_issue.sh"
      timeout: 30

    - name: cleanup
      type: bash
      command: bash "$PIPELINE_DIR/ci/cleanup.sh"
      timeout: 60

  transitions:
    # setup → fetch issue
    - event: next
      src: setup_repo
      dst: fetch_issue

    # fetch issue → create branch (or no_issues exit)
    - event: fetch_ok
      src: fetch_issue
      dst: create_branch
      condition:
        flag: issue_fetched
    - event: fetch_fail
      src: fetch_issue
      dst: no_issues
      condition:
        flag: issue_fetched
        negate: true

    # create branch → llm fix
    - event: next
      src: create_branch
      dst: llm_fix

    # llm fix → run tests
    - event: next
      src: llm_fix
      dst: run_tests

    # Tests: build fail → exit, exhausted → exit, pass → review, fail → llm_fix
    - event: build_fail
      src: run_tests
      dst: build_failed
      condition:
        flag: build_failed
    - event: tests_exhausted
      src: run_tests
      dst: loop_exhausted
      condition:
        flag: loop_exhausted
    - event: tests_ok
      src: run_tests
      dst: prepare_review
      condition:
        flag: tests_passed
    - event: tests_fail
      src: run_tests
      dst: llm_fix
      condition:
        flag: tests_passed
        negate: true

    # Code review: prepare → LLM → check
    - event: next
      src: prepare_review
      dst: code_review
    - event: next
      src: code_review
      dst: check_review

    # Review: exhausted → exit, issues → back to llm_fix, clean → commit
    - event: review_exhausted
      src: check_review
      dst: loop_exhausted
      condition:
        flag: loop_exhausted
    - event: review_issues
      src: check_review
      dst: llm_fix
      condition:
        flag: cr_issues_found
    - event: review_clean
      src: check_review
      dst: commit_push
      condition:
        flag: cr_issues_found
        negate: true

    # Commit → PR → CI
    - event: next
      src: commit_push
      dst: create_pr
    - event: next
      src: create_pr
      dst: wait_ci

    # CI: pass → merge, fail → exit
    - event: ci_ok
      src: wait_ci
      dst: merge_pr
      condition:
        flag: ci_passed
    - event: ci_fail
      src: wait_ci
      dst: ci_failed
      condition:
        flag: ci_passed
        negate: true

    # Merge → close → cleanup → done
    - event: next
      src: merge_pr
      dst: close_issue
    - event: next
      src: close_issue
      dst: cleanup
    - event: next
      src: cleanup
      dst: success
